[project]
name = "hermes-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=2.2",
    "pydantic>=2.10",
    "python-multipart>=0.0.18",
    "aiohttp>=3.11",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
